name: TikTok Scraper

on:
  # Manual trigger — set workers and batch name from GitHub UI
  workflow_dispatch:
    inputs:
      batch_name:
        description: 'Batch folder name (leave empty = auto timestamp)'
        required: false
        default: ''
      total_chunks:
        description: 'Number of parallel workers (1-50, default 20)'
        required: false
        default: '20'

  # Auto schedule — daily 2 AM Pakistan time (9 PM UTC)
  schedule:
    - cron: '0 21 * * *'

# ─────────────────────────────────────────────────────────────
# STEP 1: Prepare — generate batch name, passed to all workers
# ─────────────────────────────────────────────────────────────
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      batch_name:    ${{ steps.batch.outputs.batch_name }}
      total_chunks:  ${{ steps.batch.outputs.total_chunks }}
      chunk_matrix:  ${{ steps.batch.outputs.chunk_matrix }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏷️ Generate Batch Name + Matrix
        id: batch
        run: |
          # Batch name: use input or auto-generate timestamp
          INPUT_NAME="${{ github.event.inputs.batch_name }}"
          if [ -z "$INPUT_NAME" ]; then
            BATCH_NAME="Batch--$(date +'%Y-%m-%d-%A_%I-%M-%S-%p')"
          else
            BATCH_NAME="$INPUT_NAME"
          fi
          echo "batch_name=$BATCH_NAME" >> $GITHUB_OUTPUT
          echo "✅ Batch: $BATCH_NAME"

          # Total chunks — from input or default 20
          CHUNKS="${{ github.event.inputs.total_chunks }}"
          if [ -z "$CHUNKS" ]; then CHUNKS="20"; fi
          echo "total_chunks=$CHUNKS" >> $GITHUB_OUTPUT

          # Build JSON array for matrix: [0,1,2,...,N-1]
          MATRIX=$(python3 -c "import json; n=int('$CHUNKS'); print(json.dumps(list(range(n))))")
          echo "chunk_matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "📦 Matrix: $MATRIX"

      # ── CHANGED: check Input_Links folder instead of links.txt ──
      - name: 📋 Verify Input_Links Folder
        run: |
          if [ ! -d "Input_Links" ]; then
            echo "❌ Input_Links folder not found in repo!"
            echo "   Create it and add your .txt files, then push."
            exit 1
          fi
          FILE_COUNT=$(find Input_Links -name "*.txt" | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ Input_Links folder is empty — no .txt files found!"
            exit 1
          fi
          TOTAL_LINKS=$(cat Input_Links/*.txt | grep -v '^$' | grep -v '^Playlist' | grep -v '^---' | wc -l)
          echo "✅ Input_Links: $FILE_COUNT files | ~$TOTAL_LINKS links total"
          echo "📄 Files:"
          ls -1 Input_Links/

# ─────────────────────────────────────────────────────────────
# STEP 2: Parallel Scrape Workers (up to 50 simultaneous jobs)
# ─────────────────────────────────────────────────────────────
  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350   # ~6 hours per worker

    strategy:
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.chunk_matrix) }}
      fail-fast: false  # If one worker fails, rest keep running

    env:
      BATCH_FOLDER_NAME: ${{ needs.prepare.outputs.batch_name }}
      CHUNK_INDEX:       ${{ matrix.chunk }}
      TOTAL_CHUNKS:      ${{ needs.prepare.outputs.total_chunks }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: pip install -r requirements.txt

      - name: ⬆️ Update yt-dlp
        run: pip install -U yt-dlp

      - name: 🎬 Install ffmpeg (H.264 transcode fix)
        run: sudo apt-get install -y ffmpeg

      - name: ☁️ Install MEGAcmd
        run: |
          wget -q https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb
          sudo apt install ./megacmd-xUbuntu_22.04_amd64.deb -y

      # ── MEGAcmd: login via session token stored in GitHub Secret ──
      # Token kaise nikalna: kisi bhi logged-in machine pe "mega-session" run karo
      # Token ko GitHub → Settings → Secrets → MEGA_SESSION_TOKEN mein save karo
      - name: 🔑 MEGA Login via Session Token
        run: |
          mega-cmd > /dev/null 2>&1 &
          sleep 6
          mega-login "${{ secrets.MEGA_SESSION_TOKEN }}"
          mega-whoami

      - name: 🚀 Run Scraper (Worker ${{ matrix.chunk }})
        run: python scraper-fixed.py

      # Uploads ZIP artifact to GitHub after each worker finishes
      - name: 📦 Save Scraped Data Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-chunk-${{ matrix.chunk }}
          path: "*_artifact.zip"
          retention-days: 7
